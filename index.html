    <!-- Early Error and Diagnostic Logger -->
    <script>
      console.log('[HTML Entry] index.html parsing started at:', new Date().toISOString());
      window.addEventListener('error', function (e) {
        console.error('[Diagnostic Error Caught]', e.message, 'File:', e.filename, 'Line:', e.lineno, e.error);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        console.error('[Diagnostic Unhandled Rejection]', e.reason);
      });
    </script>
